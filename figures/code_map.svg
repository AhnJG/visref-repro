<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 316" width="860" height="316" role="img" aria-labelledby="t d">
<title id="t">How the code runs: the files under repro/ and what they pass to each other</title>
<desc id="d">run.py loops until every question and method is done. MathVista rows go to model.py, which builds the model input embeddings. methods.py keeps one Job per question and method: it sends a Request with the context to engine.py, which generates tokens and returns a Result; for the VisRef variants it passes the visual tokens V and the thinking tokens z_k to dpp.py, which returns the picked visual tokens. The final answer goes to scoring.py, and each finished question and method becomes one line of results_*.jsonl.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<style>
  .surface{fill:#fcfcfb} .frame{fill:none;stroke:#c3c2b7;stroke-dasharray:5 5}
  .ink{fill:#0b0b0b} .ink2{fill:#52514e} .muted{fill:#6f6d68}
  .box{fill:#f3f2ee;stroke:#c3c2b7} .vis{fill:rgba(42,120,214,0.10);stroke:#2a78d6}
  .chip{fill:rgba(235,104,52,0.09);stroke:#eb6834} .chiptext{fill:#c4511f}
  .edge{fill:none;stroke:#6f6d68} .head{fill:#6f6d68}
  @media (prefers-color-scheme: dark){
    .surface{fill:#1a1a19} .frame{stroke:#4a4944}
    .ink{fill:#f0efec} .ink2{fill:#c3c2b7} .muted{fill:#a19f97}
    .box{fill:#242422;stroke:#4a4944} .vis{fill:rgba(57,135,229,0.16);stroke:#3987e5}
    .chip{fill:rgba(217,89,38,0.14);stroke:#d95926} .chiptext{fill:#f0a070}
    .edge{stroke:#a19f97} .head{fill:#a19f97}
  }
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<rect class="surface" x="0" y="0" width="860" height="316" rx="10"/>
<text x="20" y="28" class="ink" font-size="15" font-weight="600">How the code runs</text>
<text x="20" y="46" class="ink2" font-size="12">Files under repro/. A row is one question × one method. The text on an arrow is what is passed.</text>

<rect class="frame" x="156" y="60" width="540" height="244" rx="12"/>
<text x="170" y="296" class="muted mono" font-size="11.5">run.py: repeats until every question × method is done</text>

<rect class="box" x="10" y="150" width="128" height="54" rx="7"/>
<rect class="box" x="166" y="150" width="124" height="54" rx="7"/>
<rect class="vis" x="360" y="150" width="150" height="54" rx="7" stroke-width="2"/>
<rect class="chip" x="360" y="70" width="150" height="46" rx="7"/>
<rect class="box" x="360" y="232" width="150" height="46" rx="7"/>
<rect class="box" x="560" y="150" width="120" height="54" rx="7"/>
<rect class="box" x="716" y="150" width="130" height="54" rx="7"/>

<g text-anchor="middle">
  <text x="74" y="173" class="ink" font-size="13" font-weight="600">MathVista</text>
  <text x="74" y="191" class="ink2" font-size="11">question, image, answer</text>
  <text x="228" y="173" class="ink mono" font-size="13" font-weight="600">model.py</text>
  <text x="228" y="191" class="ink2" font-size="11">builds the model input</text>
  <text x="435" y="173" class="ink mono" font-size="13" font-weight="600">methods.py</text>
  <text x="435" y="191" class="ink2" font-size="11">one Job per row</text>
  <text x="435" y="90" class="ink mono" font-size="13" font-weight="600">dpp.py</text>
  <text x="435" y="107" class="ink2" font-size="11">picks image tokens</text>
  <text x="435" y="252" class="ink mono" font-size="13" font-weight="600">engine.py</text>
  <text x="435" y="269" class="ink2" font-size="11">generates tokens, entropy</text>
  <text x="620" y="173" class="ink mono" font-size="13" font-weight="600">scoring.py</text>
  <text x="620" y="191" class="ink2" font-size="11">extracts, scores</text>
  <text x="781" y="173" class="ink mono" font-size="13" font-weight="600">results_*.jsonl</text>
  <text x="781" y="191" class="ink2" font-size="11">one line per row</text>
</g>

<g class="edge" stroke-width="1.3" marker-end="url(#ah)">
  <line x1="138" y1="177" x2="164" y2="177"/>
  <line x1="290" y1="177" x2="358" y2="177"/>
  <line x1="510" y1="177" x2="558" y2="177"/>
  <line x1="680" y1="177" x2="714" y2="177"/>
  <line x1="422" y1="204" x2="422" y2="230"/>
  <line x1="448" y1="232" x2="448" y2="206"/>
  <line x1="422" y1="150" x2="422" y2="118"/>
  <line x1="448" y1="116" x2="448" y2="148"/>
</g>
<g font-size="11">
  <text x="324" y="170" class="ink2" text-anchor="middle">embeddings</text>
  <text x="534" y="170" class="ink2" text-anchor="middle">answer</text>
  <text x="414" y="222" class="ink2" text-anchor="end">Request (context)</text>
  <text x="456" y="222" class="ink2">Result (tokens)</text>
  <text x="414" y="138" class="ink2" text-anchor="end">V, z_k</text>
  <text x="456" y="138" class="chiptext">picked tokens (VisRef variants)</text>
</g>
</svg>
