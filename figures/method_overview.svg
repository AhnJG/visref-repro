<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" width="1060" height="430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">How ST, TSR and VisRef run in this reproduction, and which settings we could not find in the paper</title>
<desc id="d">Image and question, then a thinking step. ST answers after one step. TSR runs a stopping check on the answer entropy and, if it is high, appends "Wait, think more" and thinks again. VisRef does the same but first re-injects a DPP-selected subset of the visual tokens. Orange notes mark our choices for settings we could not find in the paper: token limits, the reasoning-token representation, the DPP stop at the kernel rank (about one fifth of m injected, a confirmed difference), the injection format, the entropy estimator, and the answer handling.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<style>
  .surface{fill:#fcfcfb} .frame{fill:none;stroke:rgba(11,11,11,0.10)}
  .ink{fill:#0b0b0b} .ink2{fill:#52514e} .muted{fill:#6f6d68}
  .box{fill:#f3f2ee;stroke:#c3c2b7} .vis{fill:rgba(42,120,214,0.10);stroke:#2a78d6}
  .chip{fill:rgba(235,104,52,0.09);stroke:#eb6834}
  .edge{fill:none;stroke:#6f6d68} .head{fill:#6f6d68}
  @media (prefers-color-scheme: dark){
    .surface{fill:#1a1a19} .frame{stroke:rgba(255,255,255,0.10)}
    .ink{fill:#f0efec} .ink2{fill:#c3c2b7} .muted{fill:#a19f97}
    .box{fill:#242422;stroke:#4a4944} .vis{fill:rgba(57,135,229,0.16);stroke:#3987e5}
    .chip{fill:rgba(217,89,38,0.14);stroke:#d95926}
    .edge{stroke:#a19f97} .head{fill:#a19f97}
  }
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
</style>
<rect class="surface" x="0" y="0" width="1060" height="430" rx="10"/>
<rect class="frame" x="0.5" y="0.5" width="1059" height="429" rx="10"/>
<text x="24" y="34" class="ink" font-size="16" text-anchor="start" font-weight="600">ST, TSR and VisRef as run in this reproduction</text>
<text x="24" y="54" class="ink2" font-size="12" text-anchor="start">Algorithm 1 of the paper, InternVL3.5-1B. The three methods share the first thinking step (same seed).</text>
<path class="edge" d="M250,128 V84 H961.0 V127" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="605.5" y="78" class="ink2" font-size="12" text-anchor="middle">ST: one thinking step, then the answer</text>
<path class="edge" d="M330,128 V108 H688 V127" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="509.0" y="102" class="ink2" font-size="12" text-anchor="middle">TSR: no re-injection</text>
<rect class="box" x="24" y="128" width="150" height="64" rx="8" stroke-width="1.25"/>
<text x="99.0" y="150" class="ink" font-size="13" text-anchor="middle" font-weight="600">Image + question</text>
<text x="99.0" y="167" class="ink2" font-size="11.5" text-anchor="middle">visual tokens V</text>
<rect class="box" x="210" y="128" width="160" height="64" rx="8" stroke-width="1.25"/>
<text x="290.0" y="150" class="ink" font-size="13" text-anchor="middle" font-weight="600">Thinking step k</text>
<text x="290.0" y="167" class="ink2" font-size="11.5" text-anchor="middle">reasoning tokens z<tspan dy="3" font-size="8.6">k</tspan><tspan dy="-3">​</tspan></text>
<rect class="vis" x="406" y="128" width="196" height="64" rx="8" stroke-width="1.25"/>
<text x="504.0" y="150" class="ink" font-size="13" text-anchor="middle" font-weight="600">Re-inject Ṽ<tspan dy="3" font-size="9.8">k</tspan><tspan dy="-3">​</tspan> ⊆ V</text>
<text x="504.0" y="167" class="ink2" font-size="11.5" text-anchor="middle">DPP: relevant and diverse</text>
<text x="504.0" y="184" class="ink2" font-size="11.5" text-anchor="middle">m = ⌊0.3·|V|⌋ tokens</text>
<rect class="box" x="638" y="128" width="176" height="64" rx="8" stroke-width="1.25"/>
<text x="726.0" y="150" class="ink" font-size="13" text-anchor="middle" font-weight="600">Stopping check</text>
<text x="726.0" y="167" class="ink2" font-size="11.5" text-anchor="middle">answer entropy H<tspan dy="3" font-size="8.6">k</tspan><tspan dy="-3">​</tspan></text>
<text x="726.0" y="184" class="ink2" font-size="11.5" text-anchor="middle">δ = 0.25, K<tspan dy="3" font-size="8.6">max</tspan><tspan dy="-3">​</tspan> = 10</text>
<rect class="box" x="886" y="128" width="150" height="64" rx="8" stroke-width="1.25"/>
<text x="961.0" y="150" class="ink" font-size="13" text-anchor="middle" font-weight="600">Final answer</text>
<text x="961.0" y="167" class="ink2" font-size="11.5" text-anchor="middle">scored on the text after</text>
<text x="961.0" y="184" class="ink2" font-size="11.5" text-anchor="middle">the last &lt;/think&gt;</text>
<path class="edge" d="M174,160.0 H209" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<path class="edge" d="M370,160.0 H405" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<path class="edge" d="M602,160.0 H637" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<path class="edge" d="M814,160.0 H885" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="850.0" y="136.0" class="ink2" font-size="11" text-anchor="middle">stop if</text>
<text x="850.0" y="150.0" class="ink2" font-size="11" text-anchor="middle">H<tspan dy="3" font-size="8.2">k</tspan><tspan dy="-3">​</tspan> &lt; δ</text>
<text x="850.0" y="182.0" class="ink2" font-size="11" text-anchor="middle">or k = K<tspan dy="3" font-size="8.2">max</tspan><tspan dy="-3">​</tspan></text>
<path class="edge" d="M726.0,192 V228 H290.0 V193" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="508.0" y="245" class="ink2" font-size="12" text-anchor="middle">“Wait, think more” → step k + 1   (if H<tspan dy="3" font-size="9.0">k</tspan><tspan dy="-3">​</tspan> ≥ δ and k &lt; K<tspan dy="3" font-size="9.0">max</tspan><tspan dy="-3">​</tspan>)</text>
<rect class="chip" x="24" y="268" width="150" height="84" rx="6" stroke-width="1.25"/>
<text x="34" y="286" class="ink" font-size="11.5" text-anchor="start">dynamic tiling:</text>
<text x="34" y="302" class="ink" font-size="11.5" text-anchor="start">max_num 12 + thumbnail</text>
<text x="34" y="318" class="ink" font-size="11.5" text-anchor="start">→ mean |V| = 1,961.5</text>
<rect class="chip" x="210" y="268" width="160" height="84" rx="6" stroke-width="1.25"/>
<text x="220" y="286" class="ink" font-size="11.5" text-anchor="start">≤ 1,024 tokens per step</text>
<text x="220" y="302" class="ink" font-size="11.5" text-anchor="start">≤ 10,240 tokens in total</text>
<rect class="chip" x="406" y="268" width="196" height="84" rx="6" stroke-width="1.25"/>
<text x="416" y="286" class="ink" font-size="11.5" text-anchor="start">Z = input embeddings of z<tspan dy="3" font-size="8.6">k</tspan><tspan dy="-3">​</tspan></text>
<text x="416" y="302" class="ink" font-size="11.5" text-anchor="start">greedy DPP stops at kernel rank:</text>
<text x="416" y="318" class="ink" font-size="11.5" text-anchor="start">≈ m/5 injected (confirmed</text>
<text x="416" y="334" class="ink" font-size="11.5" text-anchor="start">difference; paper: m)</text>
<rect class="chip" x="638" y="268" width="176" height="84" rx="6" stroke-width="1.25"/>
<text x="648" y="286" class="ink" font-size="11.5" text-anchor="start">H from 1 sampled answer</text>
<text x="648" y="302" class="ink" font-size="11.5" text-anchor="start">after &lt;/think&gt; + \boxed</text>
<text x="648" y="318" class="ink" font-size="11.5" text-anchor="start">(T = 1, ≤ 16 tokens)</text>
<rect class="chip" x="886" y="268" width="150" height="84" rx="6" stroke-width="1.25"/>
<text x="896" y="286" class="ink" font-size="11.5" text-anchor="start">truncated thinking:</text>
<text x="896" y="302" class="ink" font-size="11.5" text-anchor="start">“Final Answer:” (s1)</text>
<text x="896" y="318" class="ink" font-size="11.5" text-anchor="start">answer at its cap:</text>
<text x="896" y="334" class="ink" font-size="11.5" text-anchor="start">DEER answer forcing</text>
<rect class="chip" x="406" y="360" width="196" height="26" rx="6" stroke-width="1.25"/>
<text x="416" y="377" class="ink" font-size="11.5" text-anchor="start">Ṽ<tspan dy="3" font-size="8.6">k</tspan><tspan dy="-3">​</tspan> untagged, before &lt;/think&gt;</text>
<rect class="box" x="24" y="397" width="22" height="14" rx="3" stroke-width="1.25"/>
<text x="54" y="408" class="ink2" font-size="12" text-anchor="start">step of Algorithm 1 (paper)</text>
<rect class="vis" x="240" y="397" width="22" height="14" rx="3" stroke-width="1.25"/>
<text x="270" y="408" class="ink2" font-size="12" text-anchor="start">VisRef only</text>
<rect class="chip" x="372" y="397" width="22" height="14" rx="3" stroke-width="1.25"/>
<text x="402" y="408" class="ink2" font-size="12" text-anchor="start">our choice: not found in the paper (evidence in docs/SPEC_LEDGER.md)</text>
</svg>
