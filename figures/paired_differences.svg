<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 386" width="840" height="386" role="img" aria-labelledby="t d">
<title id="t">Paired accuracy differences on MathVista testmini: our reproduction vs. the VisRef paper</title>
<desc id="d">VisRef - ST: ours +2.2 pp (95% CI +0.3 to +4.1), paper +5.9 pp, effect size not reproduced (same direction, different size); VisRef - TSR: ours −0.1 pp (95% CI −2.0 to +1.7), paper +3.5 pp, effect size not reproduced; TSR - ST: ours +2.3 pp (95% CI +0.6 to +4.0), paper +2.4 pp, consistent with the paper value</desc>
<style>
  .surface{fill:#fcfcfb} .ink{fill:#0b0b0b} .ink2{fill:#52514e} .muted{fill:#6f6d68}
  .grid{stroke:#e1e0d9} .base{stroke:#9a9890} .frame{stroke:rgba(11,11,11,0.10);fill:none}
  .ours{fill:#2a78d6} .ours-l{stroke:#2a78d6} .paper{fill:#eb6834} .ring{stroke:#fcfcfb}
  @media (prefers-color-scheme: dark){
    .surface{fill:#1a1a19} .ink{fill:#f0efec} .ink2{fill:#c3c2b7} .muted{fill:#a19f97}
    .grid{stroke:#2c2c2a} .base{stroke:#6b6a64} .frame{stroke:rgba(255,255,255,0.10)}
    .ours{fill:#3987e5} .ours-l{stroke:#3987e5} .paper{fill:#d95926} .ring{stroke:#1a1a19}
  }
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .num{font-variant-numeric:tabular-nums}
</style>
<rect class="surface" x="0" y="0" width="840" height="386" rx="10"/>
<rect class="frame" x="0.5" y="0.5" width="839" height="385" rx="10"/>
<text x="24" y="34" class="ink" font-size="16" text-anchor="start" font-weight="600">Paired accuracy differences: our reproduction vs. the paper</text>
<text x="24" y="56" class="ink2" font-size="12" text-anchor="start">InternVL3.5-1B on MathVista testmini, n = 1,000 questions, pre-specified reading (a)</text>
<line class="ours-l" x1="24" y1="84" x2="48" y2="84" stroke-width="2" stroke-linecap="round"/>
<circle class="ours ring" cx="36" cy="84" r="5" stroke-width="2"/>
<text x="56" y="88" class="ink2" font-size="12" text-anchor="start">Ours: paired difference with 95% bootstrap CI</text>
<polygon class="paper ring" points="366,77.5 372.5,84 366,90.5 359.5,84" stroke-width="2"/>
<text x="378" y="88" class="ink2" font-size="12" text-anchor="start">Paper: difference in Appendix Table 6</text>
<line class="grid" x1="206.0" y1="116" x2="206.0" y2="272" stroke-width="1"/>
<text x="206.0" y="290" class="muted num" font-size="11" text-anchor="middle">−2</text>
<line class="base" x1="266.0" y1="116" x2="266.0" y2="272" stroke-width="1"/>
<text x="266.0" y="290" class="muted num" font-size="11" text-anchor="middle">0</text>
<line class="grid" x1="326.0" y1="116" x2="326.0" y2="272" stroke-width="1"/>
<text x="326.0" y="290" class="muted num" font-size="11" text-anchor="middle">+2</text>
<line class="grid" x1="386.0" y1="116" x2="386.0" y2="272" stroke-width="1"/>
<text x="386.0" y="290" class="muted num" font-size="11" text-anchor="middle">+4</text>
<line class="grid" x1="446.0" y1="116" x2="446.0" y2="272" stroke-width="1"/>
<text x="446.0" y="290" class="muted num" font-size="11" text-anchor="middle">+6</text>
<text x="326.0" y="310" class="muted" font-size="11" text-anchor="middle">difference in accuracy (percentage points)</text>
<text x="500" y="110" class="muted" font-size="11" text-anchor="start">values (pp) and classification</text>
<text x="24" y="140" class="ink" font-size="13" text-anchor="start" font-weight="600">VisRef − ST</text>
<text x="24" y="156" class="muted" font-size="11" text-anchor="start">main comparison</text>
<polygon class="paper ring" points="443.0,126.5 449.5,133 443.0,139.5 436.5,133" stroke-width="2"/>
<line class="ours-l" x1="275.0" y1="149" x2="389.0" y2="149" stroke-width="2" stroke-linecap="round"/>
<line class="ours-l" x1="275.0" y1="144" x2="275.0" y2="154" stroke-width="2" stroke-linecap="round"/>
<line class="ours-l" x1="389.0" y1="144" x2="389.0" y2="154" stroke-width="2" stroke-linecap="round"/>
<circle class="ours ring" cx="332.0" cy="149" r="5.5" stroke-width="2"/>
<text x="500" y="140" class="ink num" font-size="12" text-anchor="start">ours +2.2 (+0.3 to +4.1) · paper +5.9</text>
<text x="500" y="156" class="ink2" font-size="12" text-anchor="start">effect size not reproduced, same direction</text>
<text x="24" y="192" class="ink" font-size="13" text-anchor="start" font-weight="600">VisRef − TSR</text>
<text x="24" y="208" class="muted" font-size="11" text-anchor="start">main comparison</text>
<polygon class="paper ring" points="371.0,178.5 377.5,185 371.0,191.5 364.5,185" stroke-width="2"/>
<line class="ours-l" x1="206.0" y1="201" x2="317.0" y2="201" stroke-width="2" stroke-linecap="round"/>
<line class="ours-l" x1="206.0" y1="196" x2="206.0" y2="206" stroke-width="2" stroke-linecap="round"/>
<line class="ours-l" x1="317.0" y1="196" x2="317.0" y2="206" stroke-width="2" stroke-linecap="round"/>
<circle class="ours ring" cx="263.0" cy="201" r="5.5" stroke-width="2"/>
<text x="500" y="192" class="ink num" font-size="12" text-anchor="start">ours −0.1 (−2.0 to +1.7) · paper +3.5</text>
<text x="500" y="208" class="ink2" font-size="12" text-anchor="start">effect size not reproduced</text>
<text x="24" y="244" class="ink" font-size="13" text-anchor="start" font-weight="600">TSR − ST</text>
<text x="24" y="260" class="muted" font-size="11" text-anchor="start">supplementary</text>
<polygon class="paper ring" points="338.0,230.5 344.5,237 338.0,243.5 331.5,237" stroke-width="2"/>
<line class="ours-l" x1="284.0" y1="253" x2="386.0" y2="253" stroke-width="2" stroke-linecap="round"/>
<line class="ours-l" x1="284.0" y1="248" x2="284.0" y2="258" stroke-width="2" stroke-linecap="round"/>
<line class="ours-l" x1="386.0" y1="248" x2="386.0" y2="258" stroke-width="2" stroke-linecap="round"/>
<circle class="ours ring" cx="335.0" cy="253" r="5.5" stroke-width="2"/>
<text x="500" y="244" class="ink num" font-size="12" text-anchor="start">ours +2.3 (+0.6 to +4.0) · paper +2.4</text>
<text x="500" y="260" class="ink2" font-size="12" text-anchor="start">consistent with the paper value</text>
<text x="24" y="350" class="muted" font-size="11" text-anchor="start">Consistent: the CI excludes 0 and contains the paper value. Not reproduced: the CI excludes the paper value.</text>
<text x="24" y="366" class="muted" font-size="11" text-anchor="start">The classification rule was fixed after an interim look at 759 questions (REPORT.md §2.4); the paper reports no per-question results.</text>
</svg>
